<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pigeon</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #fff;
      }
      .image-stack {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .image-stack img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .layer-hand {
        z-index: 1;
      }
      .image-stack .layer-egg {
        z-index: 5;
        cursor: pointer;
        width: 500px;
        height: auto;
        top: 400px;
        right: 400px;
        left: unset;
      }
      .layer-pigeon {
        z-index: 3;
        pointer-events: none;
      }
      .pigeon-click {
        position: absolute;
        z-index: 4;
        cursor: pointer;
        top: 10%;
        left: 30%;
        width: 40%;
        height: 70%;
      }
      .image-stack h1 {
        position: absolute;
        z-index: 10;
        text-align: left;
        top: 20px;
        left: 50px;
        color: white;
        font-style: italic;
        font-size: 60px;
        text-shadow: 2px 2px 6px rgba(1, 148, 164, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="image-stack">
      <h1>비둘기야 놀자~</h1>
      <img class="layer-hand" src="hand.png" alt="손" />
      <img
        class="layer-egg"
        src="egg.png"
        alt="알"
        onclick="location.href = 'egg/index.html'"
      />
      <img class="layer-pigeon" src="mainPigeon.png" alt="비둘기" />
      <div
        class="pigeon-click"
        onclick="location.href = 'pigeon/index.html'"
      ></div>
    </div>
  </body>
</html>
